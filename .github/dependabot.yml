# 依赖更新。**这个文件不是可选的**——CI 里的第三方 action 全部按 commit SHA 固定
# （见 .github/workflows/ci.yml 里的说明：tag 是可移动引用，上游重打一次 tag
# 我们下一次 CI 就会静默跑到不同的代码上）。SHA 固定换来了确定性，代价是
# **它们不会自己更新**，没有 dependabot 就会一直烂在那儿，包括安全修复。
#
# dependabot 认识 SHA 固定这种写法：它会同时更新 SHA 和后面那条 `# vX.Y.Z` 注释。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # 本项目有一条明确的产品约束：**不新增第三方依赖**（见 CONTRIBUTING）。
    # 所以这里只要"升级现有依赖"，把大版本跳跃留给人工判断——
    # PySide6 / pygame 这种带原生库的大版本升级会牵动打包链路与 UI 度量，
    # 不该由机器人自动开 PR 就合。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
