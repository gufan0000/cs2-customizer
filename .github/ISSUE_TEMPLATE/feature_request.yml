name: 功能建议 / Feature request
description: 提一个新功能，或改进现有功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议之前请先看一眼下面的「项目边界」——有几类需求是产品决策上明确不做的，
        提了也只能关掉，白费你的时间。

  - type: checkboxes
    id: scope
    attributes:
      label: 项目边界确认（必读）
      description: |
        本项目只使用 Valve 官方 GSI 接口 + 读写 cfg 文件，不读写游戏内存、不注入进程、不提供竞技优势。
        开源版是功能子集：没有账号系统、不做云同步、不做在线更新检查、音乐播放器只播本地文件、
        不随仓库分发任何第三方版权素材。
      options:
        - label: 我的建议**不涉及**读写游戏内存、注入进程、绕过反作弊或任何提供竞技优势的能力
          required: true
        - label: 我的建议**不涉及**账号系统、云端同步、在线更新检查、音乐平台在线解析/下载
          required: true
        - label: 我的建议**不需要**在仓库里附带第三方版权素材（游戏音效、图标、皮肤等）
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题是什么
      description: 先说问题，别直接说方案。「我想要 X」不如「我在做 Y 的时候卡在 Z」有用。
      placeholder: |
        我经常在几张地图之间换不同的准心配置，现在每次都要手动进准心页改四五个值，
        一局开始前来不及弄完。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
      description: 想清楚的话，顺手说说入口放在哪、默认值是什么、会不会影响现有用户
      placeholder: |
        在预设中心里支持"按地图自动切换准心预设"，默认关闭，开启后按 GSI 报的地图名匹配。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过或考虑过的替代做法
      description: 比如「用 cfg 自己写了 alias，但 GSI 状态变化时没法自动切」
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及的模块
      options:
        - 准心
        - 音效 / 语音
        - 击杀图标
        - HUD 配色
        - 自定闪光
        - 开镜放大
        - 局内视角 viewmodel
        - 道具瞄点
        - 语音输出 / 音板
        - 音乐播放器
        - 预设中心 / 配置快照
        - 资源体检 / 素材导入
        - 设置搜索
        - 界面 / 主题 / 无障碍
        - 打包 / 安装 / 开发者体验
        - 其他
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: 你愿意自己实现吗
      description: 不愿意也完全没关系，如实填就行
      options:
        - 我愿意提 PR 实现（已读过 CONTRIBUTING.md）
        - 我愿意参与测试 / 提供素材和场景
        - 只是提个想法
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、其他工具的做法、相关的 issue 链接等
    validations:
      required: false
